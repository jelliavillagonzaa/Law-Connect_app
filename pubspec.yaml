name: law_connect4
description: "A new Flutter project."

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.0.4
  shared_preferences: ^2.2.2
  get: ^4.6.6
  flutter_local_notifications: ^17.2.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.1.1
  http: ^1.2.0
  url_launcher: ^6.3.2
  intl: ^0.19.0
  add_2_calendar: ^2.1.0
  file_picker: ^8.1.2
  google_maps_flutter: ^2.9.0
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  permission_handler: ^11.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  syncfusion_flutter_pdf: ^33.1.44
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  supabase_flutter: ^2.12.2
  firebase_app_check: ^0.3.2+10
  google_fonts: ^6.2.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/Landingpage.png
    - assets/data/misamis_occidental_addresses.json
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/launcher_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/launcher_icon.png"



